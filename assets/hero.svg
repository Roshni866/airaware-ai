  <!-- soft clean-air swirl -->
  <path d="M60 60 C 200 10, 350 10, 420 55 S 650 90, 740 50" stroke="#B9DED5" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M30 90 C 180 45, 330 45, 400 85 S 620 115, 760 80" stroke="#EAF3F1" stroke-width="2" fill="none" opacity="0.3" stroke-linecap="round"/>
