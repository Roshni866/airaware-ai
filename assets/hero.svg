    <rect x="80" y="120" width="22" height="120"/>
    <rect x="112" y="160" width="26" height="80"/>
    <rect x="600" y="140" width="28" height="100"/>
    <rect x="636" y="110" width="22" height="130"/>
    <rect x="668" y="155" width="30" height="85"/>
    <rect x="708" y="130" width="20" height="110"/>
  </g>
  <!-- foreground skyline -->
  <g fill="#0A1E1D">
    <rect x="150" y="100" width="34" height="160"/>
    <rect x="190" y="70" width="26" height="190"/>
    <rect x="222" y="130" width="40" height="130"/>
    <rect x="268" y="90" width="22" height="170"/>
    <rect x="296" y="150" width="30" height="110"/>
    <rect x="470" y="110" width="30" height="150"/>
