<svg width="800" height="260" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A4A47"/>
      <stop offset="100%" stop-color="#247C72"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0B65A" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#F0B65A" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="260" fill="url(#sky)"/>
  <rect y="140" width="800" height="120" fill="url(#haze)"/>
  <!-- distant skyline -->
  <g fill="#0D2524" opacity="0.55">
