# AirAware AI — experiment configuration.
# Every decision that could bias test results (split dates, event thresholds,
# interval level, model-selection rule) is fixed here BEFORE the test period
# is evaluated. See docs/PREREGISTRATION.md.

project: airaware-ai
random_seed: 42

station:
  openaq_location_id: 8118
  name: "New Delhi-8118 (U.S. Embassy Chanakyapuri, AirNow reference monitor)"
  city: New Delhi
  country: India
  latitude: 28.63576
  longitude: 77.22445
  timezone: Asia/Kolkata
  parameter: pm25

data:
  start_date: "2018-01-01"   # first full year with near-complete coverage
  end_date: null             # null = latest date available in the archive
  min_hours_per_day: 18      # daily mean requires >= 75% of hours
  valid_min: 0.0             # hourly values < 0 are discarded as invalid
  valid_max: 999.0           # hourly values > 999 µg/m³ are discarded (sensor ceiling / sentinel)
  download_workers: 8

weather:
  source: "Open-Meteo Historical Weather API (archive-api.open-meteo.com)"
  hourly_vars:
    - temperature_2m
    - relative_humidity_2m
    - wind_speed_10m
    - wind_direction_10m
    - precipitation
  # boundary_layer_height was evaluated but excluded: Open-Meteo returns nulls for
  # 2024-01..2024-06 for every reanalysis model, i.e. inside the calibration period.

features:
  pm_lags: [0, 1, 2, 3, 7]   # days before the forecast origin t (0 = day t itself)
  rolling_windows: [3, 7]    # trailing windows ending at day t

# Chronological, non-overlapping periods (inclusive end dates).
splits:
  train_end: "2022-12-31"        # train: start_date .. train_end
  val_end: "2023-12-31"          # validation: model/hyper-parameter selection
  cal_end: "2024-12-31"          # calibration: conformal residuals only
  # test: cal_end+1 .. last available day (never used for any decision)

events:
  # CPCB National AQI PM2.5 sub-index breakpoints (24-h mean, µg/m³):
  #   0-30 Good | 31-60 Satisfactory | 61-90 Moderate | 91-120 Poor | 121-250 Very Poor | >250 Severe
  primary_threshold: 120     # event = daily mean > 120 µg/m³ ("Very Poor" or worse)
  secondary_threshold: 250   # event = daily mean > 250 µg/m³ ("Severe")
  naaqs_24h: 60              # Indian NAAQS 24-h PM2.5 standard, reported for context

conformal:
  alpha: 0.10                # nominal 90% prediction intervals

evaluation:
  bootstrap_resamples: 2000
  bootstrap_block_days: 14

selection:
  # Pre-registered rule: the deployed model is the (model, feature set) with the
  # lowest VALIDATION MAE, excluding the oracle-weather diagnostic feature set.
  metric: mae
  exclude_feature_sets: [C_oracle]
